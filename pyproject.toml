[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triger"
version = "0.1.0"
description = "Structured cross-omics interaction discovery with a triple-graph model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jiaao Yu", email = "jy2941@umd.edu" }]
keywords = ["multi-omics", "integration", "biclustering", "dense subgraph", "greedy peeling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jy2941/TriGer-PyPI"
"Paper code" = "https://github.com/jy2941/TriGer"

[tool.hatch.build.targets.wheel]
packages = ["src/triger"]
