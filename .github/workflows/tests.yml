# Tests on Python 3.10-3.15 (Linux), the oldest and newest Python on macOS
# and Windows, and the minimum supported versions of the dependencies.
# publish.yml calls this workflow before building a release.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest

  minimum-versions:
    name: Minimum dependency versions (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Lower bounds from pyproject.toml; keep the two in agreement.
      - run: >-
          python -m pip install "numpy==1.21.*" "scipy==1.8.*"
          "matplotlib==3.5.*" "pandas==1.4.*" "pytest==7.*"
      - run: python -m pip install --no-deps .
      - run: python -m pytest
