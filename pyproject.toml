[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "triger"
dynamic = ["version"]
description = "Structured cross-omics interaction discovery with a triple-graph model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Jiaao Yu", email = "jy2941@umd.edu" },
    { name = "Huang Lin", email = "huanglinfrederick@gmail.com" },
]
maintainers = [{ name = "Huang Lin", email = "huanglinfrederick@gmail.com" }]
keywords = ["multi-omics", "integration", "biclustering", "dense subgraph", "greedy peeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=1.4"]

[project.urls]
Homepage = "https://github.com/MATRIX-Research-Lab/TriGer-PyPI"
Issues = "https://github.com/MATRIX-Research-Lab/TriGer-PyPI/issues"
Changelog = "https://github.com/MATRIX-Research-Lab/TriGer-PyPI/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.64898/2026.09.10.749540"
"R package" = "https://github.com/MATRIX-Research-Lab/TriGer"
"MATLAB code" = "https://github.com/jy2941/TriGer"

[tool.hatch.version]
path = "src/triger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/triger"]

[tool.hatch.build.targets.sdist]
include = ["src/triger", "tests", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
